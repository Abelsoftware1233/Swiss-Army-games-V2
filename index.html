<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Software Swiss Army | Crypt-OS</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <h1 class="title"><span class="title-bold">Software Swiss Army</span> <span class="title-sep">|</span> Crypt-OS</h1>
      <p class="subtitle">GOVERNMENT AUTHORIZED ACCESS ONLY</p>
    </div>
    <div class="header-right">
      <div class="status-badge">
        <span class="status-dot"></span>System<br>Online
      </div>
    </div>
  </header>

  <div class="divider"></div>

  <!-- TARGET ANALYSIS -->
  <section class="card card-border-blue">
    <h2 class="card-title">Target Analysis</h2>
    <input type="text" id="hashInput" class="hash-input" placeholder="Voer versleutelde hash" />
    <div class="btn-row">
      <button class="btn btn-primary" onclick="startDecryption()">START DECRYPTION</button>
      <button class="btn btn-secondary" onclick="analyzeType()">ANALYZE TYPE</button>
    </div>
    <div id="resultBox" class="result-box hidden"></div>
  </section>

  <!-- PROCESSING SPEED -->
  <section class="card">
    <h2 class="card-title-sm">Processing Speed<br><span class="card-title-unit">(Hashes/sec)</span></h2>
    <canvas id="speedChart" height="80"></canvas>
    <div class="chart-labels">
      <span>10s</span><span>20s</span><span>30s</span><span>40s</span><span>50s</span><span>60s</span>
    </div>
  </section>

  <!-- SYSTEM RESOURCES -->
  <section class="card">
    <p class="section-label">SYSTEM RESOURCES</p>
    <div class="resource-row">
      <span>CPU Usage</span>
      <span id="cpuVal">0%</span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="cpuBar" style="width:0%"></div>
    </div>
    <div class="resource-row" style="margin-top:14px;">
      <span>Active Threads</span>
      <span id="threadsVal">0/16</span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar threads" id="threadsBar" style="width:0%"></div>
    </div>
  </section>

  <!-- ACTIVITY LOG -->
  <section class="card">
    <p class="section-label">ACTIVITY LOG</p>
    <div class="log-box" id="activityLog">
      <span class="log-empty">— No activity recorded —</span>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
